     on the al:lang event that each page fires when the language changes. */
  (() => {
    const EP = "https://script.google.com/macros/s/AKfycbzesY6E8kjU48TvLbjr-qGEIZ3Ij3lVEf_zY0MiZIkCRQyznOi-GZZ0YR6DtsvJ_M15Jg/exec"; /* build:botendpoint */
    const GOALS = ["debt", "budget", "investing", "plan"];
    // El nombre que se guarda va siempre en espaniol, aunque el visitante
    // navegue en otro idioma: sus registros se leen en uno solo.
    const TIERS = [["pl.p1.n", "Sistema"], ["pl.p2.n", "Acompanamiento"], ["pl.p3.n", "Directo"]];
    const MAILRE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    const soft = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // What we have collected so far. Nothing leaves the page until the
    // consent step, and nothing is stored anywhere else.
    const data = { name: "", email: "", whatsapp: "", goal: "", plan: "", marketing: false };
    let step = "hi", open = false, sending = false, lastFocus = null;

    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    };

    /* ---------- shell ---------- */
    const launch = el("button", "bot-launch");
    launch.type = "button";
    launch.setAttribute("aria-expanded", "false");
    launch.innerHTML = '<span class="bot-launch-ic" aria-hidden="true">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.8L3 21l1.9-5A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4Z"/></svg></span>'
      + '<span class="bot-launch-t"></span>';
    const launchT = launch.querySelector(".bot-launch-t");

    const pop = el("div", "bot-pop");
    pop.hidden = true;
    pop.setAttribute("role", "dialog");
    pop.setAttribute("aria-modal", "false");

    const head = el("div", "bot-head");
    const headTx = el("div", "bot-head-t");
    const headH = el("b");
    const headS = el("span");
    headTx.append(headH, headS);
    const shut = el("button", "bot-x");
    shut.type = "button";
    shut.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    head.append(headTx, shut);

    const log = el("div", "bot-log");
    log.setAttribute("role", "log");
    log.setAttribute("aria-live", "polite");
    const act = el("div", "bot-act");
    const note = el("p", "bot-note");
    pop.append(head, log, act, note);
    document.body.append(launch, pop);
    headH.id = "botTitle";
    pop.setAttribute("aria-labelledby", "botTitle");

    /* ---------- messages ---------- */
    function say(text, who){
      const row = el("div", "bot-msg " + (who === "me" ? "me" : "bot"));
      row.append(el("p", null, text));
      log.append(row);
      log.scrollTop = log.scrollHeight;
      return row;
    }
    const wipe = () => { while (log.firstChild) log.firstChild.remove(); };
    const clearAct = () => { while (act.firstChild) act.firstChild.remove(); };

    function chips(options){
      const box = el("div", "bot-chips");
      options.forEach(o => {
        const b = el("button", "bot-chip", o.label);
        b.type = "button";
        b.addEventListener("click", () => o.go());
        box.append(b);
      });
      act.append(box);
      const first = box.querySelector("button");
      if (first) first.focus();
    }

    // One text row: an input and a send button that share a submit path.
    function ask(opts){
      const form = el("form", "bot-form");
      // The email step is type="email", and the browser would otherwise refuse
      // the submit with its own bubble, written in the browser's language
      // rather than the site's. Our check runs instead, and speaks all three.
      form.noValidate = true;
      const input = el("input");
      input.type = opts.type || "text";
      input.className = "bot-in";
      input.autocomplete = opts.auto || "off";
      input.placeholder = opts.ph || "";
      input.setAttribute("aria-label", opts.label);
      if (opts.mode) input.inputMode = opts.mode;
      const go = el("button", "bot-go");
      go.type = "submit";
      go.setAttribute("aria-label", t("bot.send"));
      go.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';
      form.append(input, go);
      form.addEventListener("submit", ev => {
        ev.preventDefault();
        const v = input.value.trim();
        if (!v && !opts.empty) return;
        opts.go(v, input);
      });
      act.append(form);
      if (opts.skip){
        const s = el("button", "bot-skip", t("bot.skip"));
        s.type = "button";
        s.addEventListener("click", () => opts.skip());
        act.append(s);
      }
      input.focus();
    }

    function err(msg){
      clearAct();
      const p = el("p", "bot-err", msg);
      p.setAttribute("role", "alert");
      act.append(p);
    }

    /* ---------- the script ---------- */
    function goTo(next){
      step = next;
      clearAct();
      if (next === "goal"){
        say(t("bot.qGoal"));
        chips(GOALS.map(g => ({ label: t("su.g." + g), go: () => { data.goal = g; say(t("su.g." + g), "me"); goTo("plan"); } })));
      } else if (next === "plan"){
        say(t("bot.qPlan"));
        chips(TIERS.map(([key, name]) => ({
          label: t(key),
          go: () => { data.plan = name; say(t(key), "me"); goTo("name"); }
        })).concat([{
          label: t("bot.planUnsure"),
          go: () => { data.plan = ""; say(t("bot.planUnsure"), "me"); say(t("bot.planLater")); goTo("name"); }
        }]));
      } else if (next === "name"){
        say(t("bot.qName"));
        ask({ label: t("bot.qName"), ph: t("su.namePh"), auto: "name",
              go: v => { data.name = v.slice(0, 80); say(data.name, "me"); goTo("email"); } });
      } else if (next === "email"){
        say(t("bot.qEmail"));
        askEmail();
      } else if (next === "wa"){
        say(t("bot.qWa"));
        ask({ label: t("su.wa"), ph: t("su.waPhFull"), type: "tel", auto: "tel", mode: "tel",
              go: v => { data.whatsapp = v.slice(0, 40); say(data.whatsapp, "me"); goTo("consent"); },
              skip: () => { data.whatsapp = ""; say(t("bot.skip"), "me"); goTo("consent"); } });
      } else if (next === "consent"){
        say(t("bot.qConsent"));
        say(t("su.consent"));
        // Dos formas de aceptar: la sesion sola, o la sesion y ademas el correo.
        // El permiso de mercadeo es aparte porque el proposito es otro.
        chips([{ label: t("bot.yes"), go: () => { data.marketing = false; send(); } },
               { label: t("bot.yesMkt"), go: () => { data.marketing = true; send(); } },
               { label: t("bot.no"), go: () => { clearAct(); say(t("bot.bye")); } }]);
      }
    }

    function askEmail(){
      ask({ label: t("su.email"), ph: t("su.emailPh"), type: "email", auto: "email",
            go: (v, input) => {
              if (!MAILRE.test(v)){
                input.setAttribute("aria-invalid", "true");
                const p = act.querySelector(".bot-err");
                if (p) p.remove();
                const w = el("p", "bot-err", t("bot.errEmail"));
                w.setAttribute("role", "alert");
                act.append(w);
                return;
              }
              data.email = v.slice(0, 160);
              say(data.email, "me");
              goTo("wa");
            } });
    }

    /* ---------- send ---------- */
    async function send(){
      if (sending) return;
      sending = true;
      clearAct();
      const wait = say(t("bot.sending"));
      wait.classList.add("bot-wait");
      let tz = "";
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch { /* older browser */ }
      const body = JSON.stringify({
        name: data.name, email: data.email, whatsapp: data.whatsapp,
        goal: data.goal, source: "chatbot" + (data.plan ? " - " + data.plan : ""),
        lang, consent: true, marketing: data.marketing, timezone: tz,
        notes: "Del chat del sitio." + (data.plan ? " Plan de interes: " + data.plan + "." : "")
      });
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 15000);
      let ok = false;
      try {
        if (!EP) throw new Error("no endpoint");
        // text/plain keeps this a simple request: no CORS preflight for Apps Script
        const res = await fetch(EP, { method: "POST", signal: ctrl.signal,
          headers: { "Content-Type": "text/plain;charset=utf-8" }, body });
        ok = res.ok;
        if (ok){ const j = await res.json().catch(() => ({ ok: true })); ok = j.ok !== false; }
      } catch { ok = false; } finally { clearTimeout(timer); sending = false; }
      wait.remove();
      if (ok){
        step = "done";
        say(t("bot.ok").replace("{name}", data.name));
        clearAct();
        const a = el("a", "bot-cta", t("bot.okCta"));
        a.href = "signup.html";
        act.append(a);
        a.focus();
      } else {
        step = "consent";
        err(t("bot.err"));
        const r = el("button", "bot-chip", t("bot.retry"));
        r.type = "button";
        r.addEventListener("click", send);
        act.append(r);
      }
    }

    /* ---------- open and close ---------- */
    function start(){
      wipe();
      clearAct();
      sending = false;
      say(t("bot.hi"));
      goTo("goal");
    }

    function show(){
      if (open) return;
      open = true;
      lastFocus = document.activeElement;
      pop.hidden = false;
      launch.setAttribute("aria-expanded", "true");
      launch.classList.add("is-open");
      if (soft) requestAnimationFrame(() => pop.classList.add("in"));
      else pop.classList.add("in");
      if (step === "hi") start();
      else {
        const f = act.querySelector("input, button, a");
        if (f) f.focus(); else shut.focus();
      }
    }

    function hide(){
      if (!open) return;
      open = false;
      pop.classList.remove("in");
      launch.setAttribute("aria-expanded", "false");
      launch.classList.remove("is-open");
      const done = () => { pop.hidden = true; };
      if (soft) setTimeout(done, 180); else done();
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    launch.addEventListener("click", () => (open ? hide() : show()));
    shut.addEventListener("click", hide);
    document.addEventListener("keydown", ev => { if (ev.key === "Escape" && open) hide(); });

    /* ---------- language ---------- */
    function paint(){
      launchT.textContent = t("bot.open");
      launch.setAttribute("aria-label", t("bot.open"));
      headH.textContent = t("bot.title");
      headS.textContent = t("bot.sub");
      shut.setAttribute("aria-label", t("bot.close"));
      log.setAttribute("aria-label", t("bot.log"));
      note.textContent = t("bot.note");
      // Rewriting mid-conversation would leave half the thread in the old
      // language, so an open chat restarts in the new one; a closed one is
      // simply rebuilt the next time it opens.
      if (step !== "hi" && !sending){
        if (open) start();
        else { step = "hi"; wipe(); clearAct(); }
      }
    }
    document.addEventListener("al:lang", paint);
    paint();
  })();

  /* ═══════════════ BUTTON FEEL ═══════════════
     Replaces two older behaviours: a fill that wiped upward on hover, and a
     magnet that dragged three buttons toward the cursor. Both moved the
     button along a direction that meant nothing.

     What buttons do instead follows the way Apple builds this:

       · Feedback lands on pointer-DOWN, not on release. Waiting for the
         click to show anything reads as dead.
       · The only thing that moves is scale, and it moves through a spring,
         so every state change starts from where the button actually is on
         screen rather than from where the last animation meant to end.
       · The spring is critically damped - no overshoot. Bounce belongs to
         motion a gesture threw; a press throws nothing, so it settles clean.
       · Press again mid-settle and it re-targets from the live value. No
         jump, no queue, no waiting for the previous animation to finish.

     Response is 0.3s for the press and 0.4s to settle back, which are the
     values Apple publishes for a press and for a reposition. Nothing here is
     hand-tuned by eye.

     Reduced motion gets no scaling at all: the colour change in the
     stylesheet carries the feedback instead. */
  (() => {
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    const REST = 1, HOVER = 1.02, PRESS = 0.97;
    const STEP = 1 / 120;              // fixed substep keeps the integrator stable
    const springs = new WeakMap();

    function feel(btn, grow){
      const up = grow === undefined ? HOVER : grow;
      let x = REST, v = 0, target = REST, raf = 0, response = 0.4;
      let hovering = false, pressed = false;

      const paint = () => { btn.style.transform = x === 1 ? "" : "scale(" + x.toFixed(4) + ")"; };

      const tick = last => now => {
        raf = 0;
        let dt = Math.min(0.05, (now - last) / 1000);
        const w = 2 * Math.PI / response;
        while (dt > 0){
          const h = Math.min(STEP, dt);
          // critically damped: a = -w²(x - target) - 2w·v
          v += (-w * w * (x - target) - 2 * w * v) * h;
          x += v * h;
          dt -= h;
        }
        if (Math.abs(x - target) < 0.0004 && Math.abs(v) < 0.004){
          x = target; v = 0; paint();
          if (x === REST) btn.style.willChange = "";
          return;
        }
        paint();
        raf = requestAnimationFrame(tick(now));
      };

      const to = (next, resp) => {
        target = next; response = resp;
        if (reduce.matches){ x = next; v = 0; paint(); return; }
        btn.style.willChange = "transform";
        if (!raf) raf = requestAnimationFrame(tick(performance.now()));
      };

      const settle = () => to(pressed ? PRESS : hovering ? up : REST, pressed ? 0.3 : 0.4);

      // Hover only where a real pointer exists; a touch never "hovers".
      btn.addEventListener("pointerenter", ev => {
        if (ev.pointerType !== "mouse") return;
        hovering = true; settle();
      });
      btn.addEventListener("pointerleave", () => { hovering = false; pressed = false; settle(); });
      btn.addEventListener("pointerdown", ev => {
        if (btn.hasAttribute("disabled")) return;
        pressed = true; settle();
        // Keep the release even if the finger slides off the button.
        if (btn.setPointerCapture) { try { btn.setPointerCapture(ev.pointerId); } catch { /* ignore */ } }
      });
      const release = () => { if (!pressed) return; pressed = false; settle(); };
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", () => { pressed = false; hovering = false; settle(); });
      btn.addEventListener("blur", release);
    }

    // Buttons grow a little under the pointer. The wordmark does not: it is a
    // logo, and a logo that swells when you approach it is a logo drawing
    // attention to itself. It still answers the press, like everything else.
    const bind = root => {
      if (!root.querySelectorAll) return;
      root.querySelectorAll(".btn").forEach(b => {
        if (springs.has(b)) return;
        springs.set(b, true);
        feel(b);
      });
      root.querySelectorAll(".brand").forEach(b => {
        if (springs.has(b)) return;
        springs.set(b, true);
        feel(b, REST);
      });
    };
    bind(document);
    // The chat and the slot picker build their buttons after this runs.
    document.addEventListener("al:btn", () => bind(document));
  })();

  applyLang(detect());
  requestAnimationFrame(() => document.body.classList.add("rdy"));
  // Reading offsetWidth forces the reflow it needs, so this is measured now
  // rather than next frame: a deferred frame can be throttled, and a stale
  // indicator sitting off its button is worse than none at all. The observer
  // then catches every later cause - rotation, a font arriving, a longer word
  // in another language - without any of them having to know about it.
  moveInd();
  // El interruptor solo empieza a deslizarse despues de estar colocado.
  requestAnimationFrame(() => perBox.classList.add("ready"));
  if (window.ResizeObserver) new ResizeObserver(moveInd).observe(perBox);
  else window.addEventListener("resize", moveInd);
})();

</script>
</body>
</html>
